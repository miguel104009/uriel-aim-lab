name: Compilar APK Uriel Aim Lab

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle na nuvem
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Localizar pasta e gerar o aplicativo APK
        run: |
          PASTA_PROJETO=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -n "$PASTA_PROJETO" ]; then
            echo "Projeto encontrado na pasta: $PASTA_PROJETO"
            cd "$PASTA_PROJETO"
            gradle assembleDebug --no-daemon
          else
            echo "ERRO: Arquivo settings.gradle.kts nao foi encontrado!"
            echo "Arquivos existentes no repositorio:"
            find . -maxdepth 3
            exit 1
          fi

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: UrielAimLab-Instalador
          path: '**/build/outputs/apk/debug/*.apk'
